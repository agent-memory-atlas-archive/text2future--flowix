[package]
name = "flowix-skill-package-check"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
flate2 = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
url = "2"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }

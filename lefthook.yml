# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
#
# 只保留当前真正启用的钩子：ESLint 与架构边界检查。
# 两者都只作用于暂存文件，保证提交时延时可接受；
# 全量检查（单测 / 打包预算 / Rust）仍在 CI 里跑。
pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{ts,tsx}"
      run: npx eslint {staged_files}

    - name: architecture
      glob: "*.{ts,tsx}"
      run: node scripts/check-architecture.mjs

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flowix</title>
    <style>
      /* Critical first-paint frame colors, before the main theme CSS loads.
       * Keep aligned with styles/theme/{rock,light,dark,ember}.css.
       * Zero specificity lets the full theme palette take over in any load order. */
      :where(:root) {
        --frame-bg: #F4F3F1;
      }
      :where([data-theme="light"]) {
        --frame-bg: oklch(0.988 0.006 255);
      }
      :where([data-theme="dark"]) {
        --frame-bg: oklch(0.173 0.009 265);
      }
      :where([data-theme="ember"]) {
        --frame-bg: oklch(0.985 0.005 50);
      }
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      #app-loading,
      [data-startup-screen="initialization"] {
        background: var(--frame-bg);
      }
      /* Critical first-paint copy of .flowix-loading-ring and .flowix-spin in styles/index.css. */
      .flowix-loading-ring {
        box-sizing: border-box;
        width: 1.25rem;
        height: 1.25rem;
        border: 2px solid color-mix(in oklch, var(--muted-foreground, #737373) 26%, transparent);
        border-top-color: var(--brand, #c65d3b);
        border-radius: 9999px;
      }
      .flowix-spin {
        animation: flowix-spin var(--flowix-spin-duration, 1s) linear infinite;
      }
      @keyframes flowix-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .flowix-spin { animation: none; }
      }
      html[data-window-material][data-theme="mist"],
      html[data-window-material][data-theme="mist"] body,
      html[data-window-material][data-theme="mist"] #root {
        background: transparent !important;
      }
      html[data-theme="mist"] #app-loading {
        background: transparent;
      }
      html[data-window-material][data-theme="mist"],
      html[data-window-material][data-theme="mist"] body,
      html[data-window-material][data-theme="mist"] #root {
        background: transparent !important;
      }
    </style>
    <!--
      首屏 boot: 在 CSS paint 之前把 data-theme 写到 <html>。
      走外部文件 (而不是 inline <script>) 是因为 Tauri CSP 的
      script-src 'self' 'unsafe-eval' 不含 'unsafe-inline'。 同源
      脚本不受此限制。 详见 public/theme-boot.js。
    -->
    <script src="/theme-boot.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <div id="app-loading" aria-hidden="true">
      <span class="flowix-loading-ring flowix-spin"></span>
    </div>
    <!-- Vite resolves this bootstrap module to the desktop entry at build
         time, keeping the bundle rooted at a single application entry. -->
    <script type="module" src="/entrypoints/main.ts"></script>
  </body>
</html>

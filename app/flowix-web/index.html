<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flowix</title>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: var(--background, #f5f5f4);
        pointer-events: none;
      }
      html[data-theme="dark"] #app-loading {
        background: var(--background, #171717);
      }
      html[data-theme="mist"] #app-loading {
        background: transparent;
      }
      html[data-window-material][data-theme="mist"],
      html[data-window-material][data-theme="mist"] body,
      html[data-window-material][data-theme="mist"] #root {
        background: transparent !important;
      }
    </style>
    <!--
      首屏 boot: 在 CSS paint 之前把 data-theme 写到 <html>。
      走外部文件 (而不是 inline <script>) 是因为 Tauri CSP 的
      script-src 'self' 'unsafe-eval' 不含 'unsafe-inline'。 同源
      脚本不受此限制。 详见 public/theme-boot.js。
    -->
    <script src="/theme-boot.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <div id="app-loading" aria-hidden="true"></div>
    <!-- Vite resolves this bootstrap module to the desktop entry at build
         time, keeping the bundle rooted at a single application entry. -->
    <script type="module" src="/entrypoints/main.ts"></script>
  </body>
</html>
